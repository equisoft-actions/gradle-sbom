name: Produce and upload a Gradle SBOM.
description: Scan Gradle dependencies and uploads them using Github Submission API.

inputs:
  gradle-properties:
    description: Content of a gradle.properties file that will be passed to the gradle runner.
    required: false
  gradle-build-module:
    deprecationMessage: This input is deprecated and ignored with no replacement.
    description: Deprecated (ignored). Previously used to select modules to resolve.
    required: false
    default: ":"
  gradle-modules-auto-detect:
    deprecationMessage: This input is deprecated and ignored with no replacement.
    description: Deprecated (ignored). Previously used to auto-detect submodules.
    required: false
    default: "false"
  gradle-build-configuration:
    deprecationMessage: This input is deprecated and ignored with no replacement.
    description: Deprecated (ignored). Previously used to select the configuration for dependency resolution.
    required: false
  working-directory:
    description: Relative path under $GITHUB_WORKSPACE where the root project is located.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Configure gradle properties
      shell: bash
      run: |-
        cat <<EOT >> ${{ inputs.working-directory }}/gradle.properties
        ${{ inputs.gradle-properties }}
        EOT

    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      with:
        build-root-directory: ${{ inputs.working-directory }}
        cache-provider: basic
        dependency-graph: generate-and-submit
